<!DOCTYPE html>
<html lang="id" class="light scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="JoKelar — Platform asistensi tugas akademik modern, terstruktur, anti-plagiasi, dan bergaransi resmi untuk mahasiswa & pelajar se-Indonesia." />
    <meta name="keywords" content="jasa tugas kuliah, asistensi akademik, tugas coding, olah data spss, skripsi, jokelar" />
    <title>JoKelar — Platform Asistensi Tugas Akademik Modern #1 Indonesia</title>

    <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <!-- Material Symbols Outlined -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />

    <!-- App Styles -->
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body class="bg-[#fafcff] text-slate-800 font-sans antialiased selection:bg-blue-600 selection:text-white min-h-screen relative overflow-x-hidden">
    <!-- Ambient Backdrop Gradient Spheres (Clean Light Mode) -->
    <div class="fixed inset-0 pointer-events-none z-0 overflow-hidden">
      <!-- Soft Blue Glow -->
      <div class="absolute -top-[15%] left-1/2 -translate-x-1/2 w-[900px] h-[550px] bg-blue-500/[0.07] rounded-full blur-[140px] animate-pulse-glow"></div>
      <!-- Soft Amber/Yellow Glow from Logo -->
      <div class="absolute top-[35%] -right-[8%] w-[650px] h-[650px] bg-amber-400/[0.06] rounded-full blur-[160px]"></div>
      <!-- Soft Indigo Glow -->
      <div class="absolute top-[70%] -left-[10%] w-[600px] h-[600px] bg-sky-400/[0.05] rounded-full blur-[160px]"></div>
      <!-- Modern Ultra-Fine Subtle Dot Grid -->
      <div class="absolute inset-0 bg-[radial-gradient(#94a3b8_1px,transparent_1px)] [background-size:24px_24px] opacity-[0.22] [mask-image:radial-gradient(ellipse_60%_50%_at_50%_0%,#000_70%,transparent_100%)]"></div>
    </div>

    <!-- Application Mounting Point -->
    <div id="app" class="relative z-10 flex flex-col min-h-screen"></div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
